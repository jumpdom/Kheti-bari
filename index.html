<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Mandi App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fb;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p.intro {
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        #location-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s, transform 0.2s;
        }
        #location-btn:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }
        .status {
            margin: 20px 0;
            font-size: 15px;
            color: #e67e22;
            font-weight: 500;
        }
        .mandi-section {
            display: none;
            margin-top: 30px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }
        .mandi-card {
            background-color: #34495e;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .mandi-card h2 {
            font-size: 22px;
        }
        .section-title {
            margin-bottom: 15px;
            color: #2c3e50;
            border-left: 5px solid #27ae60;
            padding-left: 10px;
        }
        .crop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .crop-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #eaeded;
        }
        .crop-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .crop-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .crop-info {
            padding: 15px;
            text-align: center;
        }
        .crop-info h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .crop-info p {
            font-size: 13px;
            color: #27ae60;
            font-weight: bold;
        }

        /* Detail Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #95a5a6;
        }
        .close-btn:hover {
            color: #333;
        }
        #modal-crop-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin: 15px 0;
        }
        #modal-crop-desc {
            text-align: left;
            color: #555;
            line-height: 1.6;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌾 Apni Paas Ki Mandi Aur Rate Dekhein 🌾</h1>
        <p class="intro">Neeche diye gye button par click karke location allow karein taaki aapke aas-paas ki mandi ka data dikh sake.</p>
        
        <button id="location-btn">📍 Mandi Dhundhein</button>
        <div id="status" class="status"></div>

        <!-- Mandi Data Section -->
        <div id="mandi-section" class="mandi-section">
            <div class="mandi-card">
                <h2 id="mandi-name">📍 Mandi Ka Naam Loading...</h2>
                <p id="mandi-distance" style="font-size: 14px; margin-top: 5px; opacity: 0.9;"></p>
            </div>

            <h3 class="section-title">Uplabdh Faslein, Anaj aur Sabjiyan</h3>
            <div id="crop-grid" class="crop-grid"></div>
        </div>
    </div>

    <!-- Detail Pop-up Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-crop-name" style="color: #2c3e50;">Fasal</h2>
            <img id="modal-crop-img" src="" alt="Fasal Photo">
            <div id="modal-crop-desc">Details...</div>
        </div>
    </div>

    <script>
        const locationBtn = document.getElementById('location-btn');
        const statusDiv = document.getElementById('status');
        const mandiSection = document.getElementById('mandi-section');
        const mandiNameH2 = document.getElementById('mandi-name');
        const mandiDistanceP = document.getElementById('mandi-distance');
        const cropGrid = document.getElementById('crop-grid');
        
        const modal = document.getElementById('detail-modal');
        const closeModal = document.getElementById('close-modal');
        const modalName = document.getElementById('modal-crop-name');
        const modalImg = document.getElementById('modal-crop-img');
        const modalDesc = document.getElementById('modal-crop-desc');

        // Sample Data for automatic display
        const sampleCrops = [
            { name: 'Dhaan (Paddy)', img: 'https://images.unsplash.com/photo-1536657464919-89253e2609a5?w=500', rate: '₹2,183 / Quintal', desc: '<b>Kismein:</b> Basmati, Normal Paddy<br><b>Aavak (Arrival):</b> 50 Ton<br><b>Taza Rate:</b> ₹2,183 prati quintal. Fasal ki quality achhi hai.' },
            { name: 'Chawal (Rice)', img: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500', rate: '₹3,600 / Quintal', desc: '<b>Kismein:</b> Sona Masuri, Arwa, Usna<br><b>Stock:</b> Full Stock Available<br><b>Taza Rate:</b> ₹3,600 se ₹4,200 tak chal rha hai.' },
            { name: 'Gehu (Wheat)', img: 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500', rate: '₹2,450 / Quintal', desc: '<b>Kismein:</b> Sharbati, Lokwan<br><b>Quality:</b> Premium A Grade<br><b>Taza Rate:</b> ₹2,450 / Quintal.' },
            { name: 'Makka (Maize)', img: 'https://images.unsplash.com/photo-1551754655-cd27e38d20f6?w=500', rate: '₹1,960 / Quintal', desc: '<b>Kismein:</b> Yellow Maize (Desi)<br><b>Nami (Moisture):</b> 12% (Dry)<br><b>Taza Rate:</b> ₹1,960 / Quintal.' },
            { name: 'Patwa (Jute/Leaves)', img: 'https://images.unsplash.com/photo-1589182373726-e4f658ab50f0?w=500', rate: '₹4,500 / Quintal', desc: '<b>Kismein:</b> Jute Fiber / Patwa Saag<br><b>Taza Rate:</b> Fiber ka rate ₹4,500/Quintal chal rha hai aur hara saag ₹30/Bunch bik rha hai.' },
            { name: 'Aloo (Potato)', img: 'https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=500', rate: '₹1,600 / Quintal', desc: '<b>Kismein:</b> Jyoti, Chipsona<br><b>Sabji Type:</b> Taza Naya Aaloo<br><b>Taza Rate:</b> ₹16 se ₹20 prati kilo (Wholesale: ₹1,600/Quintal).' },
            { name: 'Tamatar (Tomato)', img: 'https://images.unsplash.com/photo-1595855759920-86582396756a?w=500', rate: '₹2,500 / Quintal', desc: '<b>Type:</b> Desi aur Hybrid Tamatar<br><b>Condition:</b> Taza aur Lal crate stock<br><b>Taza Rate:</b> Mandi rate ₹25/Kg chal rha hai. Local aavak badhi hai.' }
        ];

        locationBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                statusDiv.textContent = 'Aapka browser location support nahi karta hai.';
                return;
            }

            statusDiv.textContent = 'Kripya apne browser me "Allow Location" par click karein...';
            
            navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError);
        });

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            statusDiv.innerHTML = `✅ Location Allow Ho Gayi! <br><span style="font-size:12px; color:#7f8c8d;">Latitude: ${lat.toFixed(4)}, Longitude: ${lon.toFixed(4)}</span>`;
            
            mandiNameH2.textContent = "🏢 Kshetriya Krishi Upaj Mandi (Mukhya Kendra)";
            mandiDistanceP.textContent = "⚡ Aapke current location se doori: Lagbhag 3.4 KM";

            cropGrid.innerHTML = '';
            sampleCrops.forEach(crop => {
                const card = document.createElement('div');
                card.className = 'crop-card';
                card.innerHTML = `
                    <img src="${crop.img}" alt="${crop.name}">
                    <div class="crop-info">
                        <h3>${crop.name}</h3>
                        <p>${crop.rate}</p>
                        <span style="font-size:11px; color:#95a5a6;">Click karke poori jankari dekhein</span>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    showCropDetails(crop);
                });

                cropGrid.appendChild(card);
            });

            mandiSection.style.display = 'block';
        }

        function onLocationError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusDiv.textContent = "❌ Aapne location permission deny kar di hai. Kripya setting se allow karein.";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusDiv.textContent = "❌ Location jankari uplabdh nahi hai.";
                    break;
                case error.TIMEOUT:
                    statusDiv.textContent = "❌ Location request timeout ho gayi.";
                    break;
                default:
                    statusDiv.textContent = "❌ Koi anjan error aaya.";
            }
        }

        function showCropDetails(crop) {
            modalName.textContent = crop.name;
            modalImg.src = crop.img;
            modalDesc.innerHTML = crop.desc;
            modal.style.display = 'flex';
        }

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
